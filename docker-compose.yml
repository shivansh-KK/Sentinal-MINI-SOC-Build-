version: '3.8'

# ===============================================================================
# SENTINEL SOC — Container Orchestration
# Security Operations and Automated Incident Response Platform
# ===============================================================================

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_soc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_soc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD:-sentinel_secure_pass}@db:5432/${POSTGRES_DB:-sentinel_soc}
      SECRET_KEY: ${SECRET_KEY:-sentinel-soc-super-secret-jwt-key-for-capstone-demo-2026-replace-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      RESPONSE_MODE: ${RESPONSE_MODE:-simulation}
      CORS_ORIGINS: '["http://localhost","http://localhost:5173","http://localhost:80"]'
      DEMO_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sentinel_net

  # --- React Frontend ---
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinel_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentinel_net

volumes:
  postgres_data:
    name: sentinel_postgres_data

networks:
  sentinel_net:
    name: sentinel_soc_network
    driver: bridge
